# =========================================================
# Smart City UniEVANGELICA - configuracoes da aplicacao
# =========================================================

server.port=8080
spring.application.name=smart-city-unievangelica

# Banco H2 em memoria (reinicia zerado a cada execucao)
spring.datasource.url=jdbc:h2:mem:smartcity;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# necessario para o SseEmitter nao ser cortado pelo timeout do container
spring.mvc.async.request-timeout=1800000

logging.level.br.edu.unievangelica.smartcity=INFO
