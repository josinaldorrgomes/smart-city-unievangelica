<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${module.name} + ' · Smart City UniEVANGÉLICA'">Detalhe do Módulo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex flex-wrap justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <div class="module-icon" style="width:56px;height:56px;font-size:1.7rem;"
                 th:style="'background-color:' + ${module.type.color}">
                <i th:class="'bi ' + ${module.type.icon}"></i>
            </div>
            <div>
                <div class="eyebrow" th:text="${module.type.label}">Tipo</div>
                <h3 class="mb-0" th:text="${module.name}">Nome do módulo</h3>
                <p class="mb-0 text-white-50">
                    <i class="bi bi-geo-alt"></i> <span th:text="${module.location}">Local</span>
                    &nbsp;|&nbsp;<span id="liveIndicator"><span class="live-dot"></span>Ao vivo</span>
                </p>
            </div>
        </div>
        <a th:href="@{/dashboard}" class="btn btn-outline-light mt-2 mt-md-0">
            <i class="bi bi-arrow-left me-1"></i> Voltar
        </a>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="chart-box mb-4">
                <h6 class="text-muted text-uppercase small mb-3">Sobre o módulo</h6>
                <p class="mb-2" th:text="${module.description}">Descrição</p>
                <div class="metric-row"><span>Status atual</span>
                    <span class="metric-value" id="detailStatus">
                        <span class="status-dot" id="detailStatusDot"></span>
                        <span id="detailStatusText">--</span>
                    </span>
                </div>
                <div class="metric-row"><span>Última leitura</span><span class="metric-value" id="detailTs">--:--:--</span></div>
                <div class="metric-row"><span>Leituras registradas</span><span class="metric-value" th:text="${readingCount}">0</span></div>
                <div class="metric-row"><span>Situação do módulo</span>
                    <span class="metric-value" th:text="${module.active} ? 'Ativo' : 'Inativo'">Ativo</span>
                </div>
            </div>

            <div class="chart-box">
                <h6 class="text-muted text-uppercase small mb-3">Última leitura (detalhada)</h6>
                <div id="detailMetrics">
                    <div class="text-muted small fst-italic">Aguardando dados...</div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="chart-box">
                <h6 class="text-muted text-uppercase small mb-3">
                    <i class="bi bi-graph-up-arrow me-1"></i>Série temporal em tempo real
                </h6>
                <canvas id="liveChart" height="110"></canvas>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/nav :: footer}"></div>

<script th:inline="javascript">
    const MODULE_ID = /*[[${module.id}]]*/ 0;
    const HISTORY = /*[[${history}]]*/ [];
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script th:src="@{/js/metric-labels.js}"></script>
<script th:src="@{/js/module-detail.js}"></script>
</body>
</html>
