<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Módulos IoT · Smart City UniEVANGÉLICA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex flex-wrap justify-content-between align-items-center">
        <div>
            <div class="eyebrow">Administração</div>
            <h3 class="mb-0"><i class="bi bi-cpu me-2"></i>Módulos IoT cadastrados</h3>
        </div>
        <a th:href="@{/admin/modules/new}" class="btn btn-uni mt-2 mt-md-0">
            <i class="bi bi-plus-circle me-1"></i> Novo módulo
        </a>
    </div>

    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>

    <div class="chart-box">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Nome</th>
                        <th>Localização</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${modules}">
                        <td>
                            <span class="type-chip" th:style="'background-color:' + ${m.type.color}">
                                <i th:class="'bi ' + ${m.type.icon}"></i>
                                <span th:text="${m.type.label}">Tipo</span>
                            </span>
                        </td>
                        <td>
                            <div class="fw-semibold" th:text="${m.name}">Nome</div>
                            <div class="text-muted small" th:text="${m.description}">Descrição</div>
                        </td>
                        <td th:text="${m.location}">Local</td>
                        <td>
                            <span class="badge" th:classappend="${m.active} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${m.active} ? 'Ativo' : 'Inativo'">Ativo</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{'/modules/' + ${m.id}}" class="btn btn-sm btn-outline-primary" title="Ver dashboard">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{'/admin/modules/' + ${m.id} + '/edit'}" class="btn btn-sm btn-outline-secondary" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{'/admin/modules/' + ${m.id} + '/toggle'}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-warning" title="Ativar/Inativar">
                                    <i class="bi bi-toggle2-on"></i>
                                </button>
                            </form>
                            <form th:action="@{'/admin/modules/' + ${m.id} + '/delete'}" method="post" class="d-inline"
                                  onsubmit="return confirm('Remover este módulo e todo o histórico de leituras?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Excluir">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${modules.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum módulo cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/nav :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
