<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editing} ? 'Editar Módulo' : 'Novo Módulo' + ' · Smart City UniEVANGÉLICA'">Módulo IoT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4 py-4">

    <div class="page-header">
        <div class="eyebrow">Administração</div>
        <h3 class="mb-0">
            <i class="bi" th:classappend="${editing} ? 'bi-pencil-square' : 'bi-plus-circle'"></i>
            <span th:text="${editing} ? 'Editar módulo IoT' : 'Cadastrar novo módulo IoT'">Cadastro</span>
        </h3>
    </div>

    <div class="chart-box" style="max-width: 720px;">
        <form th:action="@{/admin/modules/save}" th:object="${module}" method="post">
            <input type="hidden" th:field="*{id}" th:if="${editing}"/>

            <div class="mb-3">
                <label class="form-label">Nome do módulo</label>
                <input type="text" class="form-control" th:field="*{name}" placeholder="Ex: Estação de Qualidade do Ar - Centro" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo de módulo (categoria de Smart City)</label>
                    <select class="form-select" th:field="*{type}" required>
                        <option value="">Selecione...</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}"></option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Localização</label>
                    <input type="text" class="form-control" th:field="*{location}" placeholder="Ex: Av. Universitária, Anápolis/GO" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" rows="3" th:field="*{description}" placeholder="O que este módulo monitora?"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Intervalo de amostragem (segundos)</label>
                    <input type="number" min="1" class="form-control" th:field="*{samplingIntervalSeconds}">
                    <div class="form-text">Informativo — a simulação global roda a cada 4s para todos os módulos ativos.</div>
                </div>
                <div class="col-md-6 mb-3 d-flex align-items-end">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeCheck">
                        <label class="form-check-label" for="activeCheck">Módulo ativo (gera leituras em tempo real)</label>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-uni"><i class="bi bi-check2-circle me-1"></i>Salvar</button>
                <a th:href="@{/admin/modules}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/nav :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
