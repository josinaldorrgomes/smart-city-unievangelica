<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard · Smart City UniEVANGÉLICA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container-fluid px-4 py-4">

    <div class="page-header d-flex flex-wrap justify-content-between align-items-center">
        <div>
            <div class="eyebrow">Painel em tempo real</div>
            <h3 class="mb-1"><i class="bi bi-broadcast me-2"></i>Monitoramento de Smart City</h3>
            <p class="mb-0 text-white-50">
                <span id="liveIndicator"><span class="live-dot"></span>Ao vivo</span>
                — <span th:text="${totalModulos}">0</span> módulo(s) IoT ativo(s) transmitindo dados simulados.
            </p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/modules}" class="btn btn-uni mt-2 mt-md-0">
            <i class="bi bi-gear me-1"></i> Gerenciar Módulos
        </a>
    </div>

    <div class="row g-4" id="cardsContainer">
        <div class="col-sm-6 col-lg-4 col-xxl-3" th:each="card : ${cards}" th:id="'col-module-' + ${card.module.id}">
            <a th:href="@{'/modules/' + ${card.module.id}}" class="text-decoration-none text-reset">
            <div class="module-card card shadow-sm" th:id="'module-card-' + ${card.module.id}">
                <div class="card-body">
                    <div class="d-flex align-items-start justify-content-between mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <div class="module-icon" th:style="'background-color:' + ${card.module.type.color}">
                                <i th:class="'bi ' + ${card.module.type.icon}"></i>
                            </div>
                            <div>
                                <div class="fw-semibold" style="font-size:.92rem;" th:text="${card.module.name}">Módulo</div>
                                <div class="text-muted" style="font-size:.76rem;">
                                    <i class="bi bi-geo-alt"></i> <span th:text="${card.module.location}">Local</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mb-2 small" th:id="'status-line-' + ${card.module.id}">
                        <span class="status-dot"
                              th:classappend="${card.status != null} ? 'status-' + ${card.status} : ''"
                              th:id="'status-dot-' + ${card.module.id}"></span>
                        <span th:id="'status-text-' + ${card.module.id}"
                              th:text="${card.status != null ? card.status.label : 'Aguardando dados...'}">Status</span>
                        <span class="text-muted float-end">
                            <i class="bi bi-clock-history"></i> <span th:id="'ts-' + ${card.module.id}" th:text="${card.timestamp}">--:--:--</span>
                        </span>
                    </div>

                    <div th:id="'metrics-' + ${card.module.id}">
                        <div class="metric-row" th:each="entry : ${card.data}">
                            <span th:text="${entry.key}">chave</span>
                            <span class="metric-value" th:text="${entry.value}">valor</span>
                        </div>
                        <div class="text-muted small fst-italic" th:if="${card.data.isEmpty()}">
                            Aguardando primeira leitura...
                        </div>
                    </div>
                </div>
            </div>
            </a>
        </div>

        <div class="col-12" th:if="${totalModulos == 0}">
            <div class="alert alert-warning">
                <i class="bi bi-info-circle me-1"></i>
                Nenhum módulo IoT ativo encontrado.
                <span sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/modules/new}">Cadastre o primeiro módulo</a>.
                </span>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/nav :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/metric-labels.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
